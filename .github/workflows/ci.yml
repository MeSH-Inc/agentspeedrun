name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit; the comment names the release. The Rust
# toolchain comes from rust-toolchain.toml through the runner's rustup.

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  adapters:
    runs-on: ubuntu-latest
    strategy:
      # Each adapter's failure is its own; one must not cancel the other.
      fail-fast: false
      matrix:
        adapter: [opencode, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: cargo build --locked
      - working-directory: plugins/${{ matrix.adapter }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm test

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: cargo build --locked
      - working-directory: plugins/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          xvfb-run -a npm run test:vscode
          npm run package

  zed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/zed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add wasm32-wasip2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2

  # The release path on every push: static build, archive, installer, smoke test.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools shellcheck
      - run: shellcheck install.sh scripts/*.sh
      - run: python3 scripts/version.py check
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin speedrun --bin speedrund
      - run: scripts/package.sh x86_64-unknown-linux-musl
      - name: packaging the same binaries again gives the same bytes
        run: |
          sha256sum dist/*.tar.gz > "$RUNNER_TEMP/first.sha256"
          touch target/x86_64-unknown-linux-musl/release/speedrun README.md
          rm dist/*.tar.gz
          scripts/package.sh x86_64-unknown-linux-musl
          sha256sum -c "$RUNNER_TEMP/first.sha256"
      - run: |
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          SPEEDRUN_VERSION="v$(scripts/version.py get)" SPEEDRUN_DOWNLOAD_URL=http://127.0.0.1:8765 \
            SPEEDRUN_SKIP_ATTESTATION=1 SPEEDRUN_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          scripts/smoke.sh "$RUNNER_TEMP/bin"

  # The Claude Code plugin's hooks.json reaches users from main before any
  # release (V0.2 C-4): every hook it names must still exit 0 under the last
  # released binary.
  hooks-against-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/hooks_against_release.sh
