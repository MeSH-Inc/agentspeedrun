name: release
# Push a tag vX.Y.Z (matching scripts/version.py) to publish a GitHub release.
# Run it by hand (workflow_dispatch) for a dry run that builds and tests
# every artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit; the comment names the release. The Rust
# toolchain comes from rust-toolchain.toml through the runner's rustup.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/version.py check "$REF_NAME"
          else
            python3 scripts/version.py check
          fi

  # Nothing is published from a commit whose tests fail.
  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          # Cross-built with zig, smoke-tested under QEMU.
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, zig: true }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux' && !matrix.zig
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - if: matrix.zig
        run: pip install cargo-zigbuild==0.24.0
      - if: matrix.zig
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: build
        env:
          BUILD: ${{ matrix.zig && 'zigbuild' || 'build' }}
        run: cargo "$BUILD" --release --locked --target "$TARGET" --bin speedrun --bin speedrund
      - run: scripts/smoke.sh "target/$TARGET/release"
      - run: scripts/package.sh "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  vscode:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: cargo build --locked
      - working-directory: plugins/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          xvfb-run -a npm run test:vscode
          npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode
          path: plugins/vscode/*.vsix
          if-no-files-found: error

  zed:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add wasm32-wasip2
      # Zed builds extensions from source; this only proves the tag builds.
      - working-directory: plugins/zed
        run: cargo test --locked && cargo build --locked --release --target wasm32-wasip2

  publish:
    needs: [binaries, vscode, zed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance (actions/attest-build-provenance): a signing
      # certificate from the workflow's identity, recorded as an attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.vsix > SHA256SUMS
          cat SHA256SUMS
      - name: installer works against these artifacts
        run: |
          (cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          version="v$(scripts/version.py get)"
          SPEEDRUN_VERSION="$version" SPEEDRUN_DOWNLOAD_URL=http://127.0.0.1:8765 \
            SPEEDRUN_SKIP_ATTESTATION=1 SPEEDRUN_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          scripts/smoke.sh "$RUNNER_TEMP/bin"
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.vsix
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086 # flags is empty or one word
          gh release create "$TAG" $flags --verify-tag --generate-notes \
            --title "agentspeedrun $TAG" dist/*
      - if: github.ref_type != 'tag'
        run: echo "dry run; would attest and publish:" && ls -l dist
