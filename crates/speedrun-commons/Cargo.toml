[package]
name = "speedrun-commons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
ed25519-dalek = "2.2.0"
maud = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
speedrun-core = { path = "../speedrun-core" }
speedrun-verify = { path = "../speedrun-verify" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip", "json"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
