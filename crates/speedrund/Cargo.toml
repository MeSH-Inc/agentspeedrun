[package]
name = "speedrund"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
ed25519-dalek = "2.2.0"
futures-util = "0.3.34"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
speedrun-core = { path = "../speedrun-core" }
speedrun-verify = { path = "../speedrun-verify" }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "1"
url = "2.5.8"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }

[dev-dependencies]
hex = "0.4.3"
sha2 = "0.11.1"
tempfile = "3.27.0"

[lints]
workspace = true
