[workspace]
resolver = "2"
members = ["crates/speedrun-core", "crates/speedrun-verify", "crates/speedrund", "crates/speedrun-cli", "crates/speedrun-commons"]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
